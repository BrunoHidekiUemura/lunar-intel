<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Painel do Corretor | LUNAR INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="navbar"></nav>

    <div class="container">
        <div class="stat-grid" id="stat-grid"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="portfolio">Meu Portfólio</button>
            <button class="tab-btn" data-tab="solicitacoes">Solicitações de Visita</button>
            <button class="tab-btn" data-tab="notificacoes">Notificações</button>
            <button class="tab-btn" data-tab="perfil">Perfil</button>
        </div>

        <section id="tab-portfolio" class="tab-content active">
            <div class="panel">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <h2><i class="fa-solid fa-building"></i> Meu portfólio de imóveis</h2>
                    <button class="btn" id="btn-novo-imovel">+ Novo imóvel</button>
                </div>
            </div>
            <div class="property-grid" id="grid-portfolio" style="margin-top:20px;"></div>
        </section>

        <section id="tab-solicitacoes" class="tab-content">
            <div class="panel">
                <h2><i class="fa-solid fa-calendar-check"></i> Solicitações de visita</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Imóvel</th><th>Data da visita</th><th>Status</th><th>Ações</th></tr></thead>
                        <tbody id="tabela-solicitacoes"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="tab-notificacoes" class="tab-content">
            <div class="panel">
                <h2><i class="fa-solid fa-bell"></i> Notificações</h2>
                <div id="lista-notificacoes"></div>
            </div>
        </section>

        <section id="tab-perfil" class="tab-content">
            <div class="panel">
                <h2><i class="fa-solid fa-user"></i> Meus dados</h2>
                <div id="alerta-perfil"></div>
                <form id="form-perfil">
                    <div class="grid-form">
                        <div class="input-group"><label>Nome</label><input type="text" id="perfil-nome"></div>
                        <div class="input-group"><label>Telefone</label><input type="text" id="perfil-telefone"></div>
                    </div>
                    <button type="submit" class="btn">Salvar alterações</button>
                </form>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="modal-detalhe-imovel">
        <div class="modal-box modal-box-wide">
            <button type="button" class="btn-fechar-detalhe" id="btn-fechar-detalhe">&times;</button>
            <div class="carrossel">
                <button type="button" class="carrossel-seta carrossel-anterior" id="carrossel-anterior"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carrossel-img" id="carrossel-img"></div>
                <button type="button" class="carrossel-seta carrossel-proxima" id="carrossel-proxima"><i class="fa-solid fa-chevron-right"></i></button>
                <div class="carrossel-dots" id="carrossel-dots"></div>
            </div>
            <div class="detalhe-corpo">
                <h2 id="detalhe-titulo"></h2>
                <div class="card-price" id="detalhe-preco"></div>
                <p id="detalhe-endereco" style="color:var(--text-dim); margin-bottom:14px;"></p>
                <div class="card-features" id="detalhe-features"></div>
                <p id="detalhe-descricao" style="margin-top:16px; color:var(--text-dim);"></p>
                <div class="card-actions" id="detalhe-acoes" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-imovel">
        <div class="modal-box">
            <h3 id="titulo-modal-imovel">Novo imóvel</h3>
            <div id="alerta-imovel"></div>
            <form id="form-imovel">
                <input type="hidden" id="imovel-id">
                <div class="input-group"><label>Título</label><input type="text" id="imovel-titulo" required></div>
                <div class="input-group"><label>Descrição</label><textarea id="imovel-descricao"></textarea></div>
                <div class="grid-form">
                    <div class="input-group"><label>Tipo</label>
                        <select id="imovel-tipo"><option>Casa</option><option>Apartamento</option><option>Loft</option></select>
                    </div>
                    <div class="input-group"><label>Preço (R$)</label><input type="number" id="imovel-preco" required></div>
                    <div class="input-group"><label>Área total (m²)</label><input type="number" id="imovel-area"></div>
                    <div class="input-group"><label>Quartos</label><input type="number" id="imovel-quartos"></div>
                    <div class="input-group"><label>Banheiros</label><input type="number" id="imovel-banheiros"></div>
                </div>
                <div class="grid-form">
                    <div class="input-group"><label>Logradouro</label><input type="text" id="imovel-logradouro"></div>
                    <div class="input-group"><label>Número</label><input type="text" id="imovel-numero"></div>
                    <div class="input-group"><label>Bairro</label><input type="text" id="imovel-bairro"></div>
                    <div class="input-group"><label>Cidade</label><input type="text" id="imovel-cidade"></div>
                    <div class="input-group"><label>Estado (UF)</label><input type="text" id="imovel-estado" maxlength="2"></div>
                    <div class="input-group"><label>CEP</label><input type="text" id="imovel-cep"></div>
                </div>
                <div class="input-group">
                    <label>Fotos do imóvel (pode adicionar várias)</label>
                    <div id="lista-imagens-imovel" class="lista-imagens"></div>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="imovel-nova-imagem" placeholder="https://endereco-da-foto.jpg">
                        <button type="button" class="btn btn-secondary btn-small" id="btn-add-imagem" style="flex-shrink:0;">+ Adicionar foto</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn">Salvar</button>
                    <button type="button" class="btn btn-secondary" id="btn-fechar-modal-imovel">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/guard.js" data-perfil="CORRETOR"></script>
    <script src="js/corretor.js"></script>
</body>
</html>
