<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar | LUNAR INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">LU<span>NAR</span> INTEL</a>
        <div class="nav-links"><a href="cadastro.html">Criar conta</a></div>
    </nav>

    <div class="container-narrow">
        <div class="panel">
            <h2><i class="fa-solid fa-right-to-bracket"></i> Entrar</h2>
            <div id="alerta"></div>
            <form id="form-login">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="btn btn-block">Entrar</button>
                <button type="button" id="btn-recuperar" class="btn btn-secondary btn-block" style="margin-top:10px;">Esqueci minha senha</button>
            </form>

            <form id="form-redefinir" style="display:none; margin-top:24px; padding-top:20px; border-top:1px solid var(--border);">
                <h3 style="margin-bottom:6px;"><i class="fa-solid fa-key"></i> Redefinir senha</h3>
                <p style="font-size:13px; color:var(--text-dim); margin-bottom:14px;">Digite o código de 6 dígitos (nesta versão acadêmica ele aparece no terminal do servidor) e escolha a nova senha. O código vale 15 minutos.</p>
                <div class="input-group">
                    <label>Código</label>
                    <input type="text" id="codigo" inputmode="numeric" maxlength="6" required>
                </div>
                <div class="input-group">
                    <label>Nova senha (mínimo 6 caracteres)</label>
                    <input type="password" id="nova-senha" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-block">Salvar nova senha</button>
            </form>
            <p style="margin-top:16px; font-size:13px; color:var(--text-dim); text-align:center;">
                Não tem conta? <a href="cadastro.html" style="color:var(--primary);">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const paginaPorPerfil = { CLIENTE: 'cliente.html', CORRETOR: 'corretor.html', ADMINISTRADOR: 'admin.html' };

        document.getElementById('form-login').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            try {
                const usuario = await Api.post('/auth/login', {
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                });
                window.location.href = paginaPorPerfil[usuario.tipo];
            } catch (erro) {
                mostrarAlerta('alerta', erro.message);
            }
        });

        document.getElementById('btn-recuperar').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) { mostrarAlerta('alerta', 'Informe o e-mail para recuperar a senha.'); return; }
            try {
                const { mensagem } = await Api.post('/auth/recuperar-senha', { email });
                mostrarAlerta('alerta', mensagem, 'success');
                document.getElementById('form-redefinir').style.display = 'block';
                document.getElementById('codigo').focus();
            } catch (erro) {
                mostrarAlerta('alerta', erro.message);
            }
        });

        document.getElementById('form-redefinir').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            try {
                const { mensagem } = await Api.post('/auth/redefinir-senha', {
                    email: document.getElementById('email').value,
                    codigo: document.getElementById('codigo').value,
                    senhaNova: document.getElementById('nova-senha').value,
                });
                evento.target.reset();
                evento.target.style.display = 'none';
                document.getElementById('senha').value = '';
                mostrarAlerta('alerta', mensagem, 'success');
            } catch (erro) {
                mostrarAlerta('alerta', erro.message);
            }
        });
    </script>
</body>
</html>
